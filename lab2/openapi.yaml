openapi: 3.0.0
info:
  title: Social Network API
  version: 1.0.0
  description: API for social network services including user management, wall posts, and chat

servers:
  - url: http://localhost:8000
    description: API Service
  - url: http://localhost:8001
    description: Chat Service

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Token:
      type: object
      properties:
        access_token:
          type: string
        token_type:
          type: string

    User:
      type: object
      properties:
        username:
          type: string
        email:
          type: string
        full_name:
          type: string
        disabled:
          type: boolean

    WallPost:
      type: object
      properties:
        id:
          type: integer
        content:
          type: string
        author:
          type: string
        created_at:
          type: string
          format: date-time

    Message:
      type: object
      properties:
        sender:
          type: string
        receiver:
          type: string
        content:
          type: string
        timestamp:
          type: string
          format: date-time

paths:
  /token:
    post:
      summary: Get access token
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                username:
                  type: string
                password:
                  type: string
              required:
                - username
                - password
      responses:
        '200':
          description: Successful authentication
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Token'

  /api/v1/user/create:
    post:
      summary: Create new user
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
      responses:
        '200':
          description: User created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

  /api/v1/user/search/{username}:
    get:
      summary: Search user by login
      security:
        - bearerAuth: []
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: User found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

  /api/v1/wall/post:
    post:
      summary: Create wall post
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WallPost'
      responses:
        '200':
          description: Post created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WallPost'

  /api/v1/wall:
    get:
      summary: Get wall posts
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of wall posts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WallPost'

  /api/v1/message/send:
    post:
      summary: Send message
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Message'
      responses:
        '200':
          description: Message sent successfully

  /api/v1/message:
    get:
      summary: Get messages
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Message' 