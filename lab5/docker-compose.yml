version: '3.8'

services:
  api_service:
    build: ./api_service
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    environment:
      # TODO: move these to .env file
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=social_network
      - POSTGRES_HOST=db
      - REDIS_URL=redis://redis:6379

  chat_service:
    build: ./chat_service
    ports:
      - "8001:8001"
    depends_on:
      - mongodb

  db:
    image: postgres:14
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=social_network
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  mongodb:
    image: mongo:5.0
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  redis:
    image: redis:6.2-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  mongodb_data:
  redis_data: 