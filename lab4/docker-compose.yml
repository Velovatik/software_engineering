version: '3.8'

services:
  api_service:
    build: ./api_service
    ports:
      - "8000:8000"  # REST API endpoint
    depends_on:
      - db  # needs postgres to be up first
    environment:
      # TODO: move these to  .env file
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=social_network
      - POSTGRES_HOST=db

  # Chat service - handles messaging between users
  chat_service:
    build: ./chat_service
    ports:
      - "8001:8001"
    depends_on:
      - mongodb

  db:
    image: postgres:14
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=social_network
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # MongoDB for chat messages
  mongodb:
    image: mongo:5.0
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

volumes:
  postgres_data:
  mongodb_data: 